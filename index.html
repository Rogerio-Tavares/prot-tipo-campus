<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa do Campus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="favicon.ico"  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="header-label">📍 Guia de Navegação</div>
    <h1>Mapeamento da<br>UESB</h1>
    <p>Toque em um setor para ver informações e como chegar</p>
  </header>

  <main>
    <div class="section-title" id="sectionTitle">Todos os setores</div>
    <div class="sectors-grid" id="sectorsGrid"></div>
    <div class="empty" id="emptyMsg"></div>
  </main>

  <footer>Campus · UESB</footer>

  <!-- OVERLAY + BOTTOM SHEET -->
  <div class="overlay" id="overlay" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-icon" id="sheetIcon"></div>
      <div class="sheet-title-wrap">
        <div class="sheet-title" id="sheetTitle"></div>
        <div class="sheet-subtitle" id="sheetSubtitle"></div>
      </div>
      <button class="sheet-close" onclick="closeSheet()" aria-label="Fechar">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
